name: iOS device IPA for signing

# IPA generation is manual to avoid a second macOS job on every source push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-device-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-device-ipa:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for a physical iPhone
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/BOLOLO.xcodeproj \
            -scheme BOLOLO \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/bololo-device" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned device app
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/bololo-device/Build/Products/Release-iphoneos/BOLOLO.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :DTPlatformName' "$APP/Info.plist")" = iphoneos
          xcrun lipo "$APP/BOLOLO" -verify_arch arm64
          mkdir -p "$RUNNER_TEMP/bololo-ipa/Payload"
          ditto "$APP" "$RUNNER_TEMP/bololo-ipa/Payload/BOLOLO.app"
          cd "$RUNNER_TEMP/bololo-ipa"
          zip -qry "$RUNNER_TEMP/BOLOLO-unsigned.ipa" Payload
          unzip -tq "$RUNNER_TEMP/BOLOLO-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: BOLOLO-unsigned-device-ipa
          path: ${{ runner.temp }}/BOLOLO-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
