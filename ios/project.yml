name: BOLOLO
options:
  bundleIdPrefix: com.too.bololo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  BOLOLO:
    type: application
    platform: iOS
    sources:
      - path: BOLOLO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.too.bololop50
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BOLOLO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - BOLOLOUITests
  BOLOLOUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BOLOLOUITests
    dependencies:
      - target: BOLOLO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.too.bololop50.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
