<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#ffe9f2">
  <meta name="apple-mobile-web-app-title" content="家庭喂养日记">
  <title>家庭喂养日记</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg" sizes="180x180">
  <link rel="stylesheet" href="/style.css?v=clean-timeline-2">
  <script defer src="/app.js?v=feeding-details"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="家庭喂养日记首页">
      <img src="/favicon.svg" width="37" height="37" alt="">
      <span class="brand-copy">
        <span>家庭喂养日记</span>
        <span id="birth-day" class="brand-caption" hidden></span>
      </span>
    </a>
    <button class="icon-button" id="theme" type="button" aria-label="切换夜间配色" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 14A8.8 8.8 0 0 1 10 3.2 9 9 0 1 0 20.8 14Z"/></svg>
    </button>
  </header>

  <main>
    <nav class="tabs" aria-label="页面">
      <button type="button" id="today-tab" aria-current="page">今天</button>
      <button type="button" id="history-tab">历史</button>
      <a href="/growth">成长</a>
    </nav>
    <p id="load-error" class="error-banner" role="alert" hidden></p>
    <div id="today-view">
      <div class="overview">
        <section class="hero" aria-labelledby="last-title">
          <div class="hero-copy">
            <p class="hero-label" id="last-title">上次喂奶</p>
            <div class="hero-reading">
              <p class="hero-time" id="last-time">—</p>
              <p class="hero-amount" id="last-amount"></p>
            </div>
            <p class="hero-detail" id="last-detail">加载记录中</p>
          </div>
          <button type="button" class="secondary hero-edit" id="edit-latest" hidden>改这顿</button>
        </section>
        <section class="sleep-card" id="sleep-card" aria-labelledby="sleep-title" hidden>
          <div class="section-heading">
            <h2 id="sleep-title">最近睡眠</h2>
            <span id="sleep-status" class="small muted" role="status"></span>
          </div>
          <div class="sleep-readings">
            <div><strong id="sleep-latest">—</strong><span id="sleep-wake">最近一觉</span></div>
            <div><strong id="sleep-total">—</strong><span>今日已记录睡眠</span></div>
          </div>
          <p id="sleep-recent" class="small muted" hidden></p>
        </section>
      </div>
      <button type="button" id="add-first" class="primary first-feed" hidden>记第一顿</button>
    </div>

    <section id="log" aria-labelledby="log-title">
      <div class="section-heading">
        <h1 id="log-title">今日记录</h1>
        <span id="day-label" class="muted"></span>
      </div>
      <div id="day-picker" class="date-picker" hidden>
        <button type="button" id="previous-day" aria-label="前一天">‹</button>
        <input type="date" id="selected-day" aria-label="选择查看日期">
        <button type="button" id="next-day" aria-label="后一天">›</button>
      </div>
      <div class="summary">
        <div><strong id="count">—</strong><span>喂奶次数</span></div>
        <div><strong id="total">—</strong><span>已记录奶量</span></div>
      </div>
      <p id="missing" class="small muted" hidden></p>
      <div class="auto-warning" id="auto-warning" hidden>
        <p id="auto-warning-text" class="small" role="status"></p>
        <button type="button" class="secondary log-action" id="add-offline">补记一顿</button>
      </div>
      <ul id="timeline" class="timeline"></ul>
      <p id="empty" class="empty" hidden>这一天还没有喂奶记录</p>
      <div class="today-actions" id="today-actions" hidden>
        <button type="button" id="show-all" class="secondary log-action" aria-controls="timeline" aria-expanded="false" hidden>查看全部</button>
        <button type="button" id="add-bottle" class="secondary log-action">补记一顿</button>
      </div>
      <details id="camera-filter" class="record-options" hidden>
        <summary>记录筛选</summary>
        <label class="small muted camera-filter"><input type="checkbox" id="show-camera-cry"> 显示哭声记录</label>
        <label class="small muted camera-filter"><input type="checkbox" id="show-camera-alerts"> 显示遮挡告警</label>
      </details>
      <details class="record-options" id="trend">
        <summary>奶量趋势</summary>
        <section class="trend" aria-labelledby="trend-title">
          <div class="section-heading">
            <h2 id="trend-title">最近 7 天</h2>
            <button type="button" class="secondary trend-toggle" id="trend-toggle" aria-pressed="false">看 14 天</button>
          </div>
          <p class="small muted" id="trend-average">正在读取奶量</p>
          <p class="small muted trend-legend">记录奶量（mL，含估算） · 今天进行中</p>
          <p id="trend-error" class="error-banner" role="alert" hidden></p>
          <div id="trend-chart" class="trend-chart" role="group" aria-label="每日记录奶量，单位毫升"></div>
          <section class="trend-detail" id="trend-detail" aria-labelledby="trend-day-title" hidden>
            <div class="section-heading">
              <h3 id="trend-day-title"></h3>
              <button type="button" class="secondary trend-toggle" id="close-trend-day">收起</button>
            </div>
            <p id="trend-day-status" class="small muted" role="status"></p>
            <ul id="trend-day-entries" class="timeline"></ul>
          </section>
        </section>
      </details>
    </section>

    <details class="device" id="device">
      <summary>P50 设置</summary>
      <p id="p50-summary" class="muted">检查连接中</p>
      <p id="p50-weigh" class="reference" role="status" hidden></p>
      <div class="device-actions">
        <button type="button" id="change-default" class="secondary p50-action">默认奶量</button>
        <button type="button" id="use-p50" class="secondary p50-action" hidden>带入最近出水</button>
        <button type="button" id="calibrate-p50" class="secondary p50-action" hidden>校准喂前基准</button>
      </div>
      <p id="manual-weight-status" class="reference" role="status" hidden></p>
      <div class="device-actions" id="manual-weight-actions" hidden>
        <button type="button" id="manual-weigh" class="secondary p50-action">单独称重</button>
        <button type="button" id="cancel-weigh" class="secondary p50-action" hidden>取消称重</button>
      </div>
    </details>
  </main>

  <div class="notice" id="notice" hidden>
    <span id="notice-text" role="status"></span>
    <button type="button" id="undo" hidden>撤销删除</button>
  </div>

  <dialog id="editor" aria-labelledby="editor-title">
    <form id="entry-form">
      <div class="editor-heading">
        <h2 id="editor-title">记瓶喂</h2>
        <button type="button" id="close-editor" class="icon-button" aria-label="关闭">×</button>
      </div>
      <label>本次奶量 <span class="muted">mL</span><input name="amount_ml" type="number" min="0" max="1000" inputmode="numeric" placeholder="可以留空"></label>
      <div class="quick-amount" id="quick-amount" role="group" aria-label="快速减奶量" hidden>
        <button type="button" class="secondary" data-decrease="5" aria-label="减少 5 毫升">−5 mL</button>
        <button type="button" class="secondary" data-decrease="10" aria-label="减少 10 毫升">−10 mL</button>
        <span id="quick-amount-status" class="visually-hidden" role="status"></span>
      </div>
      <p class="reference" id="water-reference" hidden></p>
      <label>喂奶开始时间<input name="started_at" type="datetime-local" required></label>
      <label>备注<textarea name="note" rows="2" maxlength="200" placeholder="选填"></textarea></label>
      <p id="form-error" class="error-banner" role="alert" hidden></p>
      <div class="editor-actions">
        <button type="button" id="delete-feed" class="danger" hidden>删除</button>
        <button type="submit" id="save-feed" class="primary">保存记录</button>
      </div>
    </form>
  </dialog>
  <dialog id="settings" aria-labelledby="settings-title">
    <form id="settings-form">
      <div class="editor-heading">
        <h2 id="settings-title">默认奶量</h2>
        <button type="button" id="close-settings" class="icon-button" aria-label="关闭">×</button>
      </div>
      <label>默认值来源
        <select name="default_mode">
          <option value="device">跟随奶机水量</option>
          <option value="custom">在网页自定</option>
        </select>
      </label>
      <label id="custom-amount" hidden>每顿默认 <span class="muted">mL</span><input name="default_amount_ml" type="number" min="1" max="1000" inputmode="numeric" required disabled></label>
      <p id="device-amount-reference" class="reference"></p>
      <p class="reference">全家共用，仅对新记录生效。</p>
      <p id="settings-error" class="error-banner" role="alert" hidden></p>
      <button type="submit" id="save-settings" class="primary">保存默认奶量</button>
    </form>
  </dialog>
</body>
</html>
