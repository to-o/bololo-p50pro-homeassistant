name: iOS simulator build and smoke test

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-smoke:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build simulator app without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/BOLOLO.xcodeproj \
            -scheme BOLOLO \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/bololo-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Choose and boot available iPhone simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available
          SIMULATOR_ID="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; o=json.load(sys.stdin); d=[x for a in o["devices"].values() for x in a if x.get("isAvailable") and x["name"].startswith("iPhone")]; print(d[0]["udid"] if d else "")')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator on runner" >&2
            exit 1
          fi
          echo "udid=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$SIMULATOR_ID"
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - name: Install and launch BOLOLO
        shell: bash
        env:
          SIMULATOR_ID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/bololo-derived/Build/Products/Debug-iphonesimulator/BOLOLO.app"
          test -d "$APP"
          xcrun simctl install "$SIMULATOR_ID" "$APP"
          xcrun simctl launch "$SIMULATOR_ID" com.too.bololop50
          mkdir -p simulator-artifacts
          sleep 5
          xcrun simctl io "$SIMULATOR_ID" screenshot simulator-artifacts/launch.png
          echo "SIMULATOR_INSTALL_LAUNCH_OK"
      - name: UI smoke test — login screen
        env:
          SIMULATOR_ID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/BOLOLO.xcodeproj \
            -scheme BOLOLO \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/bololo-derived" \
            -resultBundlePath "$RUNNER_TEMP/bololo-uitests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            -parallel-testing-enabled NO \
            test
      - name: Upload simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bololo-ios-simulator-screenshot
          path: simulator-artifacts/
          if-no-files-found: ignore
          retention-days: 7
